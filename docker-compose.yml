services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emotion_feedback
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to loopback: published as 0.0.0.0 these are a database and cache
      # with default/no credentials, reachable by anyone who can route to the
      # host. Only the backend needs them, and it reaches them over the compose
      # network by service name, not through this mapping.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emotion_feedback"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/emotion_feedback
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_ORIGIN: http://localhost:5173
      MODEL_DIR: /app/results/ml-artifacts/model-v1
      MODEL_VERSION: model-v1
    volumes:
      - ./results/ml-artifacts:/app/results/ml-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    command: celery -A app.services.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/emotion_feedback
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_ORIGIN: http://localhost:5173
      MODEL_DIR: /app/results/ml-artifacts/model-v1
      MODEL_VERSION: model-v1
    volumes:
      - ./results/ml-artifacts:/app/results/ml-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
